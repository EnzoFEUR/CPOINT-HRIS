name: Encrypted HRIS cloud backup
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Backup operation
        type: choice
        options: [create, check]
        default: create
permissions:
  contents: read
concurrency:
  group: cpoint-hris-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed backup code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install native backup tools
        run: bash scripts/backup/hosted/install-tools.sh
      - name: Install locked dependencies without package scripts
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run encrypted backup
        env:
          BACKUP_ACTION: ${{ inputs.action || 'create' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          BACKUP_B2_APPLICATION_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}
          BACKUP_CLOUD_PASSWORD: ${{ secrets.BACKUP_CLOUD_PASSWORD }}
          BACKUP_CLOUD_REPOSITORY: ${{ vars.BACKUP_CLOUD_REPOSITORY }}
        run: node scripts/backup/hosted.mjs
      - name: Remove temporary backup state
        if: always()
        run: node scripts/backup/hosted-cleanup.mjs
